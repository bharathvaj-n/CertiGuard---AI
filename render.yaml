services:
  - type: web
    name: certiguard-ai
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python setup_db.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URL
        value: https://certi-guard-ai-khaki.vercel.app
      - key: PYTHON_VERSION
        value: "3.11.0"
