services:
  - type: web
    name: certiguard-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python setup_db.py && python -m app.ml.train_classifier
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///db/certiguard.db
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
    plan: free
